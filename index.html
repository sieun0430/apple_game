<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🍎 사과게임 - 합쳐서 10을 만들어봐! 🍏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Outfit:wght@600;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFF9F2;
      --card-bg: #FFFFFF;
      --primary-red: #FF4E64;
      --apple-body: #FF5A6E;
      --apple-border: #2B2129;
      --apple-leaf: #5ED968;
      --accent-yellow: #FFE853;
      --accent-blue: #5AC8FA;
      --accent-purple: #C894FF;
      --border-dark: #2A242B;
      --shadow-color: #2A242B;
      --text-main: #2A242B;
      --text-muted: #887B8A;
      --font-jua: 'Jua', 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-cream);
      background-image:
        radial-gradient(#F0DCD3 1.5px, transparent 1.5px),
        radial-gradient(#F0DCD3 1.5px, var(--bg-cream) 1.5px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      font-family: var(--font-jua);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 12px;
      overflow-x: hidden;
    }

    /* Container */
    .game-wrapper {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    /* Header Bar */
    header {
      background: #FFFFFF;
      border: 3.5px solid var(--border-dark);
      border-radius: 20px;
      padding: 12px 18px;
      box-shadow: 4px 5px 0px var(--shadow-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-box h1 {
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      color: var(--border-dark);
      text-shadow: 1px 1px 0 #FFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-mz {
      background: var(--accent-yellow);
      border: 2px solid var(--border-dark);
      border-radius: 999px;
      font-size: 0.72rem;
      padding: 2px 8px;
      box-shadow: 2px 2px 0px var(--shadow-color);
      transform: rotate(-3deg);
      font-weight: bold;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sound-toggle-btn {
      background: #FFF;
      border: 2.5px solid var(--border-dark);
      border-radius: 12px;
      width: 38px;
      height: 38px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 3px 0 var(--shadow-color);
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .sound-toggle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 var(--shadow-color);
    }

    /* Stats Board */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: #FFF;
      border: 3px solid var(--border-dark);
      border-radius: 16px;
      padding: 8px 10px;
      box-shadow: 3px 4px 0px var(--shadow-color);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stat-card.timer-card {
      background: #EBF8FF;
    }

    .stat-card.score-card {
      background: #FFF4E5;
    }

    .stat-card.high-card {
      background: #F6EDFF;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .stat-value {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--border-dark);
    }

    /* Control Bar */
    .controls-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-action {
      flex: 1;
      padding: 10px 14px;
      border: 3px solid var(--border-dark);
      border-radius: 15px;
      font-family: var(--font-jua);
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 3px 4px 0px var(--shadow-color);
      transition: all 0.08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action:active {
      transform: translate(2px, 3px);
      box-shadow: 1px 1px 0px var(--shadow-color);
    }

    .btn-pause {
      background: var(--accent-yellow);
      color: var(--border-dark);
    }

    .btn-restart {
      background: var(--accent-blue);
      color: var(--border-dark);
    }

    .sum-indicator {
      background: #FFFFFF;
      border: 3px solid var(--border-dark);
      border-radius: 15px;
      padding: 8px 14px;
      min-width: 125px;
      text-align: center;
      box-shadow: 3px 4px 0px var(--shadow-color);
      font-size: 0.95rem;
    }

    .sum-indicator span {
      font-size: 1.3rem;
      color: var(--primary-red);
      font-weight: 900;
    }

    .sum-indicator.valid {
      background: #D4FDD7;
      animation: pulseValid 0.2s ease;
    }

    @keyframes pulseValid {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }

      100% {
        transform: scale(1);
      }
    }

    /* Game Board Canvas Container */
    .board-container {
      background: #FFFFFF;
      border: 4px solid var(--border-dark);
      border-radius: 22px;
      padding: 10px;
      box-shadow: 5px 6px 0px var(--shadow-color);
      position: relative;
      touch-action: none;
      overflow: hidden;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: #FDF9F2;
      touch-action: none;
      cursor: crosshair;
    }

    /* Pause & Gameover Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border-radius: 18px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      animation: fadeIn 0.2s ease forwards;
    }

    .overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .overlay-card {
      background: #FFF;
      border: 3.5px solid var(--border-dark);
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 5px 6px 0px var(--shadow-color);
      text-align: center;
      max-width: 85%;
    }

    .overlay-title {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--border-dark);
    }

    .overlay-desc {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .overlay-score-box {
      background: #FFF4E5;
      border: 2.5px dashed var(--border-dark);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .overlay-score-num {
      font-size: 2.4rem;
      color: var(--primary-red);
      font-weight: 900;
    }

    .btn-big {
      background: var(--apple-leaf);
      border: 3.5px solid var(--border-dark);
      border-radius: 16px;
      font-family: var(--font-jua);
      font-size: 1.25rem;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: 3px 4px 0px var(--shadow-color);
      transition: all 0.08s ease;
    }

    .btn-big:active {
      transform: translate(2px, 3px);
      box-shadow: 1px 1px 0px var(--shadow-color);
    }

    /* History Records Section */
    .history-card {
      background: #FFF;
      border: 3px solid var(--border-dark);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 4px 5px 0px var(--shadow-color);
    }

    .history-header {
      font-size: 1.05rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 110px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8F6F4;
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.88rem;
    }

    .history-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 10px;
    }

    /* Rule Tips */
    .tip-box {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      padding: 6px;
      border: 1.5px dashed #D2C4D6;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .title-box h1 {
        font-size: 1.3rem;
      }

      .stat-value {
        font-size: 1.2rem;
      }

      .btn-action {
        font-size: 0.95rem;
        padding: 8px 10px;
      }

      .sum-indicator {
        font-size: 0.85rem;
        min-width: 105px;
        padding: 6px 10px;
      }

      .sum-indicator span {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>

  <div class="game-wrapper">
    <!-- Header -->
    <header>
      <div class="title-box">
        <h1>🍎 사과게임 <span class="badge-mz">MZ POP!</span></h1>
      </div>
      <div class="header-actions">
        <button id="soundToggleBtn" class="sound-toggle-btn" title="사운드 켜기/끄기">🔊</button>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <div class="dashboard">
      <div class="stat-card timer-card">
        <div class="stat-label">⏱️ 남은 시간</div>
        <div class="stat-value" id="timerDisplay">120s</div>
      </div>
      <div class="stat-card score-card">
        <div class="stat-label">⭐ 현재 점수</div>
        <div class="stat-value" id="scoreDisplay">0</div>
      </div>
      <div class="stat-card high-card">
        <div class="stat-label">👑 최고 기록</div>
        <div class="stat-value" id="highScoreDisplay">0</div>
      </div>
    </div>

    <!-- Controls & Selection Sum -->
    <div class="controls-row">
      <button id="pauseBtn" class="btn-action btn-pause">⏸️ 일시정지</button>
      <button id="restartBtn" class="btn-action btn-restart">🔄 다시하기</button>
      <div class="sum-indicator" id="sumBox">선택 합: <span id="currentSum">0</span></div>
    </div>

    <!-- Board Area -->
    <div class="board-container" id="boardContainer">
      <canvas id="gameCanvas" width="600" height="600"></canvas>

      <!-- Pause Overlay -->
      <div class="overlay" id="pauseOverlay">
        <div class="overlay-card">
          <div class="overlay-title">⏸️ 일시 정지됨</div>
          <div class="overlay-desc">잠깐 숨 고르는 중! 준비되면 눌러줘~</div>
          <button id="resumeBtn" class="btn-big">▶️ 계속하기</button>
        </div>
      </div>

      <!-- Game Over Overlay -->
      <div class="overlay" id="gameOverOverlay">
        <div class="overlay-card">
          <div class="overlay-title" id="gameOverTitle">⏰ 타임 오버!</div>
          <div class="overlay-desc" id="gameOverComment">대단한 실력이야! 🔥</div>
          <div class="overlay-score-box">
            <span style="font-size:0.9rem; color:var(--text-muted);">최종 점수</span>
            <span class="overlay-score-num" id="finalScoreVal">0</span>
          </div>
          <button id="retryBtn" class="btn-big">✨ 다시 도전하기</button>
        </div>
      </div>
    </div>

    <!-- Recent History -->
    <div class="history-card">
      <div class="history-header">
        <span>📜 최근 플레이 기록</span>
        <span style="font-size:0.75rem; color:var(--text-muted);">최근 5회</span>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">아직 완료된 기록이 없어요!</div>
      </div>
    </div>

    <div class="tip-box">
      💡 <b>플레이 꿀팁</b>: 마우스나 손가락으로 드래그해서 사각 영역을 만들어봐!<br>선택된 사과들의 숫자 합이 <b>정확히 10</b>이 되면 사과가 팡팡 터져! 💥
    </div>
  </div>

  <script>
    /**
     * SOUND ENGINE (Web Audio API Synthesizer)
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, startVol = 0.25) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(startVol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {
          console.warn("Audio play error", e);
        }
      }

      playSelect() {
        // Light pop on selecting
        this.playTone(380 + Math.random() * 80, 'sine', 0.05, 0.12);
      }

      playSuccess() {
        // Bright two-tone pop chord
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.04);
            gain.gain.setValueAtTime(0.2, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.04);
            osc.stop(now + i * 0.04 + 0.25);
          });
        } catch (e) { }
      }

      playGameOver() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [440, 392, 349.2, 261.6].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.14);
            gain.gain.setValueAtTime(0.18, now + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.14);
            osc.stop(now + idx * 0.14 + 0.2);
          });
        } catch (e) { }
      }
    }

    /**
     * PARTICLE SYSTEM
     */
    class ParticleSystem {
      constructor() {
        this.particles = [];
      }

      burst(x, y, color = '#FF4E64', count = 12) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 5.5;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.2,
            size: 4 + Math.random() * 6,
            color: ['#FF4E64', '#FFE853', '#5ED968', '#5AC8FA', '#C894FF'][Math.floor(Math.random() * 5)],
            alpha: 1,
            decay: 0.02 + Math.random() * 0.03,
            rot: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 15
          });
        }
      }

      update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.18; // gravity
          p.alpha -= p.decay;
          p.rot += p.vRot;
          if (p.alpha <= 0) {
            this.particles.splice(i, 1);
          }
        }
      }

      draw(ctx) {
        ctx.save();
        for (const p of this.particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.strokeStyle = '#2A242B';
          ctx.lineWidth = 1.5;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        }
        ctx.restore();
      }
    }

    /**
     * MAIN GAME LOGIC
     */
    const sound = new SoundEngine();
    const particles = new ParticleSystem();

    const ROWS = 10;
    const COLS = 10;
    const INITIAL_TIME = 120; // 120 seconds
    const STORAGE_KEY_HIGH = 'apple_game_highscore';
    const STORAGE_KEY_HIST = 'apple_game_history';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const timerDisplay = document.getElementById('timerDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const currentSumDisplay = document.getElementById('currentSum');
    const sumBox = document.getElementById('sumBox');
    const soundToggleBtn = document.getElementById('soundToggleBtn');

    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const resumeBtn = document.getElementById('resumeBtn');

    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const gameOverComment = document.getElementById('gameOverComment');
    const retryBtn = document.getElementById('retryBtn');
    const historyList = document.getElementById('historyList');

    let grid = []; // 10x10 array of { val: 1-9, active: bool, animScale: 1 }
    let score = 0;
    let timeLeft = INITIAL_TIME;
    let timerInterval = null;
    let isPaused = false;
    let isGameOver = false;

    // Drag selection coordinates
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };
    let selectedCells = []; // array of [r, c]

    // High score & history
    let highScore = parseInt(localStorage.getItem(STORAGE_KEY_HIGH) || '0', 10);
    highScoreDisplay.textContent = highScore;

    function initBoard() {
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          row.push({
            val: Math.floor(Math.random() * 9) + 1, // 1 ~ 9
            active: true,
            animScale: 1
          });
        }
        grid.push(row);
      }
    }

    function renderHistory() {
      const raw = localStorage.getItem(STORAGE_KEY_HIST);
      const list = raw ? JSON.parse(raw) : [];
      if (list.length === 0) {
        historyList.innerHTML = `<div class="history-empty">아직 완료된 기록이 없어요!</div>`;
        return;
      }
      historyList.innerHTML = list.map(item => `
        <div class="history-item">
          <span>🕒 ${item.date}</span>
          <span style="font-weight:bold; color:var(--primary-red);">${item.score}점</span>
        </div>
      `).join('');
    }

    function recordHistory(finalScore) {
      const raw = localStorage.getItem(STORAGE_KEY_HIST);
      const list = raw ? JSON.parse(raw) : [];
      const now = new Date();
      const timeStr = `${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      list.unshift({ date: timeStr, score: finalScore });
      if (list.length > 5) list.pop();
      localStorage.setItem(STORAGE_KEY_HIST, JSON.stringify(list));
      renderHistory();
    }

    function startGame() {
      clearInterval(timerInterval);
      initBoard();
      score = 0;
      timeLeft = INITIAL_TIME;
      isPaused = false;
      isGameOver = false;
      selectedCells = [];
      currentSumDisplay.textContent = '0';
      sumBox.classList.remove('valid');

      scoreDisplay.textContent = '0';
      timerDisplay.textContent = `${timeLeft}s`;

      pauseOverlay.classList.remove('active');
      gameOverOverlay.classList.remove('active');
      pauseBtn.textContent = '⏸️ 일시정지';

      startTimer();
      renderHistory();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        if (!isPaused && !isGameOver) {
          timeLeft--;
          timerDisplay.textContent = `${timeLeft}s`;
          if (timeLeft <= 10) {
            timerDisplay.style.color = '#FF4E64';
          } else {
            timerDisplay.style.color = 'var(--border-dark)';
          }

          if (timeLeft <= 0) {
            handleGameOver();
          }
        }
      }, 1000);
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseOverlay.classList.add('active');
        pauseBtn.textContent = '▶️ 이어하기';
      } else {
        pauseOverlay.classList.remove('active');
        pauseBtn.textContent = '⏸️ 일시정지';
      }
    }

    function handleGameOver() {
      isGameOver = true;
      clearInterval(timerInterval);
      sound.playGameOver();

      if (score > highScore) {
        highScore = score;
        localStorage.setItem(STORAGE_KEY_HIGH, highScore.toString());
        highScoreDisplay.textContent = highScore;
        gameOverComment.textContent = '🎉 와우! 역대 최고 점수 갱신! 짱이야! 👑';
      } else if (score >= 60) {
        gameOverComment.textContent = '🔥 대단한 반응속도! 거의 사과 마스터!';
      } else if (score >= 30) {
        gameOverComment.textContent = '👍 좋은 기록이야! 다음엔 더 잘할 수 있어!';
      } else {
        gameOverComment.textContent = '🌱 사과 게임 맛보기 완료! 한 번 더 해볼까?';
      }

      finalScoreVal.textContent = score;
      recordHistory(score);
      gameOverOverlay.classList.add('active');
    }

    /**
     * DRAWING FUNCTIONS
     */
    function drawApple(cx, cy, radius, num, isSelected, animScale = 1) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(animScale, animScale);

      // Shadow
      ctx.beginPath();
      ctx.ellipse(2, radius * 0.72, radius * 0.7, radius * 0.25, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(42, 36, 43, 0.12)';
      ctx.fill();

      // Stem (줄기)
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.55);
      ctx.quadraticCurveTo(radius * 0.2, -radius * 0.95, radius * 0.35, -radius * 0.9);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#42281D';
      ctx.lineCap = 'round';
      ctx.stroke();

      // Leaf (잎사귀)
      ctx.beginPath();
      ctx.ellipse(radius * 0.28, -radius * 0.75, radius * 0.28, radius * 0.16, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = '#5ED968';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#2A242B';
      ctx.stroke();

      // Apple Body
      ctx.beginPath();
      // Double lobe heart-like apple shape
      const w = radius * 0.88;
      const h = radius * 0.82;
      ctx.moveTo(0, -h * 0.35);
      ctx.bezierCurveTo(w * 0.7, -h * 1.1, w * 1.25, -h * 0.1, w * 0.9, h * 0.75);
      ctx.bezierCurveTo(w * 0.65, h * 1.1, 0, h * 0.9, 0, h * 0.75);
      ctx.bezierCurveTo(0, h * 0.9, -w * 0.65, h * 1.1, -w * 0.9, h * 0.75);
      ctx.bezierCurveTo(-w * 1.25, -h * 0.1, -w * 0.7, -h * 1.1, 0, -h * 0.35);
      ctx.closePath();

      // Color scheme
      if (isSelected) {
        ctx.fillStyle = '#FFE066'; // Selected glow yellow
      } else {
        ctx.fillStyle = '#FF5A6E'; // MZ pastel red
      }
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2A242B';
      ctx.stroke();

      // Cute Apple Highlight (반사광)
      ctx.beginPath();
      ctx.ellipse(-w * 0.45, -h * 0.3, radius * 0.18, radius * 0.08, -Math.PI / 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.fill();

      // Number in Apple
      ctx.font = `bold ${Math.floor(radius * 0.88)}px 'Outfit', 'Jua', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Text outline
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#FFFFFF';
      ctx.strokeText(num, 0, h * 0.12);

      // Text inner
      ctx.fillStyle = '#2A242B';
      ctx.fillText(num, 0, h * 0.12);

      ctx.restore();
    }

    function render() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cellW = canvas.width / COLS;
      const cellH = canvas.height / ROWS;
      const radius = Math.min(cellW, cellH) * 0.42;

      // Draw active apples
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const item = grid[r][c];
          if (!item.active) continue;

          const cx = c * cellW + cellW / 2;
          const cy = r * cellH + cellH / 2;
          const isSelected = selectedCells.some(([sr, sc]) => sr === r && sc === c);

          drawApple(cx, cy, radius, item.val, isSelected, item.animScale);
        }
      }

      // Draw Drag Selection Box
      if (isDragging && !isPaused && !isGameOver) {
        const x1 = Math.min(dragStart.x, dragCurrent.x);
        const y1 = Math.min(dragStart.y, dragCurrent.y);
        const w = Math.abs(dragCurrent.x - dragStart.x);
        const h = Math.abs(dragCurrent.y - dragStart.y);

        ctx.save();
        ctx.fillStyle = 'rgba(90, 200, 250, 0.22)';
        ctx.fillRect(x1, y1, w, h);

        ctx.strokeStyle = '#2A242B';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 6]);
        ctx.strokeRect(x1, y1, w, h);
        ctx.restore();
      }

      // Draw particle effects
      particles.update();
      particles.draw(ctx);

      requestAnimationFrame(render);
    }

    /**
     * DRAG & INTERACTION HANDLING
     */
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      let clientX = e.clientX;
      let clientY = e.clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
      }

      return {
        x: Math.max(0, Math.min(canvas.width, (clientX - rect.left) * scaleX)),
        y: Math.max(0, Math.min(canvas.height, (clientY - rect.top) * scaleY))
      };
    }

    function calculateSelectedCells() {
      if (!isDragging) return;

      const x1 = Math.min(dragStart.x, dragCurrent.x);
      const x2 = Math.max(dragStart.x, dragCurrent.x);
      const y1 = Math.min(dragStart.y, dragCurrent.y);
      const y2 = Math.max(dragStart.y, dragCurrent.y);

      const cellW = canvas.width / COLS;
      const cellH = canvas.height / ROWS;

      const newSelected = [];
      let sum = 0;

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c].active) continue;

          const cx = c * cellW + cellW / 2;
          const cy = r * cellH + cellH / 2;

          // A cell is included if its center lies inside the drag box,
          // or if the drag box touches the cell center area.
          if (cx >= x1 && cx <= x2 && cy >= y1 && cy <= y2) {
            newSelected.push([r, c]);
            sum += grid[r][c].val;
          }
        }
      }

      selectedCells = newSelected;
      currentSumDisplay.textContent = sum;

      if (sum === 10) {
        sumBox.classList.add('valid');
      } else {
        sumBox.classList.remove('valid');
      }
    }

    function startDrag(e) {
      if (isPaused || isGameOver) return;
      sound.init();

      isDragging = true;
      const pos = getCanvasCoords(e);
      dragStart = pos;
      dragCurrent = pos;
      selectedCells = [];
      calculateSelectedCells();
    }

    function onDrag(e) {
      if (!isDragging || isPaused || isGameOver) return;
      const pos = getCanvasCoords(e);
      dragCurrent = pos;
      calculateSelectedCells();
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;

      // Check sum
      let sum = 0;
      for (const [r, c] of selectedCells) {
        if (grid[r][c].active) {
          sum += grid[r][c].val;
        }
      }

      if (sum === 10 && selectedCells.length > 0) {
        // SUCCESS: Remove apples and add score
        const cellW = canvas.width / COLS;
        const cellH = canvas.height / ROWS;

        sound.playSuccess();
        const removedCount = selectedCells.length;
        score += removedCount;
        scoreDisplay.textContent = score;

        selectedCells.forEach(([r, c]) => {
          grid[r][c].active = false;
          const cx = c * cellW + cellW / 2;
          const cy = r * cellH + cellH / 2;
          particles.burst(cx, cy, '#FF5A6E', 8);
        });

        // Check if all apples cleared
        const remaining = grid.flat().filter(item => item.active).length;
        if (remaining === 0) {
          // Bonus time and score for full clear!
          score += 50;
          scoreDisplay.textContent = score;
          handleGameOver();
        }
      }

      // Reset selection
      selectedCells = [];
      currentSumDisplay.textContent = '0';
      sumBox.classList.remove('valid');
    }

    // Canvas Events
    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startDrag(e);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isDragging) {
        onDrag(e);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (isDragging) {
        endDrag();
      }
    });

    // UI Buttons Events
    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', () => {
      if (confirm('게임을 처음부터 다시 시작할까요?')) {
        startGame();
      }
    });
    retryBtn.addEventListener('click', startGame);

    soundToggleBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      soundToggleBtn.textContent = sound.muted ? '🔇' : '🔊';
    });

    // Window Resize Support
    function handleResize() {
      const container = document.getElementById('boardContainer');
      const w = container.clientWidth - 20; // internal padding
      canvas.style.width = `${w}px`;
      canvas.style.height = `${w}px`;
    }
    window.addEventListener('resize', handleResize);

    // Boot
    handleResize();
    startGame();
    requestAnimationFrame(render);
  </script>
</body>
